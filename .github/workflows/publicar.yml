# Publica un instalador ya compilado como release de este repositorio.
#
# El release lo crea el propio workflow (GITHUB_TOKEN), asi que queda a nombre
# de github-actions y no del usuario que lo dispara: este repo es la cara
# publica que ve el cliente y no tiene por que mostrar una cuenta personal.
#
# El .exe no se guarda aqui: se baja desde la URL que se indique al lanzar el
# workflow (la del artefacto ya compilado) y se sube como adjunto del release.
# Las notas salen de .github/workflows/plantilla_notas.md.
name: publicar instalador

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version del instalador (ej. 1.1.2). Nombra el tag y el titulo del release."
        required: true
      url_exe:
        description: "URL de descarga directa del .exe ya compilado."
        required: true

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Bajar el instalador
        run: |
          set -euo pipefail
          nombre="asistente_fda_setup_${{ inputs.version }}.exe"
          curl -fL --retry 3 -o "$nombre" "${{ inputs.url_exe }}"
          # Un .exe de Windows empieza por "MZ": si la URL devolviera una
          # pagina de error, curl podria salir 0 con un HTML y el release
          # quedaria con un archivo inservible.
          if [ "$(head -c 2 "$nombre")" != "MZ" ]; then
            echo "Lo descargado no es un ejecutable de Windows." >&2
            exit 1
          fi
          ls -lh "$nombre"

      - name: Publicar el release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          nombre="asistente_fda_setup_${{ inputs.version }}.exe"
          sed "s/NOMBRE_EXE/$nombre/" .github/workflows/plantilla_notas.md > notas.md
          gh release create "v${{ inputs.version }}" "$nombre" \
            --title "Asistente FDA ${{ inputs.version }}" \
            --notes-file notas.md
